# @phlix/contracts — CI
#
# Deterministic gate: lint, typecheck, build (typecheck + bundle + d.ts),
# committed-artifact freshness checks, and the full vitest suite. The trigger
# block below is LIVE — push/pull_request against master run this workflow
# (the earlier "no runner wired" note predates the error-registry waves).
# The `verify:cites` script is deliberately NOT a step here: it needs
# checkouts of the sibling private repos and is a dev-side tripwire only.
name: contracts-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Committed-artifact freshness for EVERYTHING under dist/: the three
      # registry JSONs, both bundles, all .d.ts and the sourcemaps. `npm run
      # build` just rewrote the working copy from src/, so any diff left here
      # is the COMMITTED dist/ tree lagging the sources — the drift the
      # in-suite byte-freeze tests cannot see in CI (the build heals the
      # working copy before the suite runs, see the describe comment in
      # test/errors.test.ts). A forgotten regen fails loudly instead of
      # shipping a stale vocabulary to the Node-less PHP consumers that pin
      # these JSONs — or a stale runtime bundle and stale types to every JS
      # client that imports the tagged dist/ tree (mobile Metro require,
      # tizen/windows/ui vite; "files" ships exactly these committed bytes).
      # The build is deterministic: the emit-*.mjs scripts derive generatedAt
      # from TS provenance rather than wall-clock precisely for this gate, and
      # a full rebuild at every tip has left the tree clean since #79.
      # (Was three per-JSON steps; M-CONTRACTS-03/05 folded them into the
      # whole-tree diff, which subsumes them and adds the unguarded
      # bundle/.d.ts/.map class.)
      - name: dist/ committed-freshness check
        run: git diff --exit-code -- dist/

      - run: npm run test:run -- --coverage

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        # NOTE: continue-on-error makes a FAILED step report "success" — to check
        # whether an upload actually happened, read the step log for
        # "Coverage data uploaded", not the step conclusion.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage/lcov.info
