# @phlix/contracts — CI
#
# Deterministic gate: lint, typecheck, build (typecheck + bundle + d.ts),
# committed-artifact freshness checks, and the full vitest suite. The trigger
# block below is LIVE — push/pull_request against master run this workflow
# (the earlier "no runner wired" note predates the error-registry waves).
# The `verify:cites` script is deliberately NOT a step here: it needs
# checkouts of the sibling private repos and is a dev-side tripwire only.
name: contracts-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Committed-artifact freshness for the error-code registry. `npm run
      # build` just rewrote the working copy from src/, so any diff left here is
      # the COMMITTED dist/error-codes.json lagging the registry — the drift the
      # errors.test.ts byte-freeze cannot see in CI (the build heals the working
      # copy before the suite runs, see test/errors.test.ts describe comment).
      # A forgotten regen fails loudly instead of shipping a stale vocabulary to
      # the Node-less PHP consumers that pin this JSON.
      - name: dist/error-codes.json committed-freshness check
        run: git diff --exit-code -- dist/error-codes.json

      # Same gate for the other two committed JSONs, each mirrored against its
      # build-emitted twin: any diff here is the COMMITTED artifact lagging the
      # TS source (the tests read working-copy bytes, which the build just
      # healed — see the describe comments in test/mcp.test.ts and
      # test/routeManifest.test.ts). Node-less/TS-less consumers (phlix-hub,
      # phlix-roku-client) pin these files, so staleness ships as a wrong
      # vocabulary unless reddened here.
      - name: dist/mcp-scopes.json committed-freshness check
        run: git diff --exit-code -- dist/mcp-scopes.json

      - name: dist/server-route-manifest.json committed-freshness check
        run: git diff --exit-code -- dist/server-route-manifest.json

      - run: npm run test:run -- --coverage

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        # NOTE: continue-on-error makes a FAILED step report "success" — to check
        # whether an upload actually happened, read the step log for
        # "Coverage data uploaded", not the step conclusion.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage/lcov.info
